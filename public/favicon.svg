<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Globo Azul -->
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="55%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </radialGradient>

    <!-- Flecha Verde Superior -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="60%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#3F6212" />
    </linearGradient>

    <!-- Flecha Azul Oscuro Inferior -->
    <linearGradient id="darkBlueGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Cuerpo del Globo -->
  <circle cx="256" cy="256" r="165" fill="url(#globeGrad)" />

  <!-- Continentes Blancos -->
  <g fill="#FFFFFF" opacity="0.95">
    <path d="M 175,145 C 205,130 240,135 255,150 C 265,175 225,195 200,190 C 180,185 165,165 175,145 Z" />
    <path d="M 215,200 C 235,205 245,225 240,240 C 220,250 200,230 215,200 Z" />
    <path d="M 210,245 C 245,250 260,285 250,335 C 230,345 205,310 210,245 Z" />
    <path d="M 275,135 C 310,125 345,140 335,165 C 315,175 285,165 275,135 Z" />
    <path d="M 310,195 C 345,185 365,220 355,270 C 335,300 305,285 300,245 C 295,215 300,200 310,195 Z" />
  </g>

  <!-- Arco Superior Verde -->
  <path d="M 112,270 C 85,160 160,70 270,62 C 325,58 375,78 408,115" 
        fill="none" stroke="#65A30D" stroke-width="20" stroke-linecap="round" />

  <!-- Flecha Verde Dinámica -->
  <path d="M 220,260 Q 320,200 468,140 L 418,225 Q 310,235 220,260 Z" 
        fill="url(#greenGrad)" filter="url(#shadow)" />

  <!-- Arco Inferior Azul Oscuro -->
  <path d="M 400,242 C 427,352 352,442 242,450 C 187,454 137,434 104,397" 
        fill="none" stroke="#172554" stroke-width="20" stroke-linecap="round" />

  <!-- Flecha Azul Oscuro Dinámica -->
  <path d="M 292,252 Q 192,312 44,372 L 94,287 Q 202,277 292,252 Z" 
        fill="url(#darkBlueGrad)" filter="url(#shadow)" />
</svg>
